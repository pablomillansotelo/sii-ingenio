name: staticfiles

on:
  push:
  pull_request:

jobs:
  collectstatic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sii-django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Recolectar estáticos
        run: python manage.py collectstatic --noinput
        env:
          COLLECTSTATIC: "1"
      - name: staticfiles debe incluir marca y JS
        run: |
          test -f staticfiles/img/logo.png
          test -f staticfiles/img/logo.ico
          test -f staticfiles/img/logo-blanco.png
          test -f staticfiles/css/main.css
          test -f staticfiles/js/carrito.js

