<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
  <div class="me-auto">
    <h1 class="h3 mb-1">{{ title }}</h1>
    {% if subtitle %}<p class="text-muted mb-0">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url %}
  <a class="btn btn-primary flex-shrink-0" href="{{ action_url }}" {% if action_modal %}data-bs-toggle="modal" data-bs-target="{{ action_modal }}"{% endif %}>
    {{ action_label }}
  </a>
  {% elif action_modal %}
  <button type="button" class="btn btn-primary flex-shrink-0" data-bs-toggle="modal" data-bs-target="{{ action_modal }}">
    {{ action_label }}
  </button>
  {% endif %}
</div>
