{% extends "base.html" %}
{% block title %}{{ titulo }} · Aula{% endblock %}
{% block content %}
{% include "includes/page_header.html" with title=titulo subtitle=curso.nombre %}
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" with form=form %}
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{% url 'aula_curso' curso.pk %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
