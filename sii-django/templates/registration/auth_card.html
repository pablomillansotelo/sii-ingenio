<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingenio · Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" href="{% static 'img/logo.ico' %}">
    {% include "includes/brand_colors.html" %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-primary min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <img src="{% static 'img/logo-blanco.png' %}" alt="Ingenio" class="mb-2" style="max-height: 48px;">
                        <h1 class="h4 mb-1">Ingenio</h1>
                        <p class="small mb-0 opacity-75">{% block auth_subtitle %}Recuperar contraseña{% endblock %}</p>
                    </div>
                    <div class="card-body p-4">
                        {% block auth_body %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
