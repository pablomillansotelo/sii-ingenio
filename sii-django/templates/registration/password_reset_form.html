{% extends "registration/auth_card.html" %}
{% block auth_subtitle %}Recuperar contraseña{% endblock %}
{% block auth_body %}
<p class="text-muted">Escribe el correo de tu cuenta. Si existe, te enviamos un enlace para definir una nueva contraseña.</p>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_email">Correo</label>
    <input type="email" name="email" id="id_email" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
</form>
<p class="mb-0 mt-3 text-center"><a href="{% url 'login' %}">Volver a iniciar sesión</a></p>
{% endblock %}
