<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingenio · Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="icon" href="{% static 'img/logo.ico' %}">
    {% include "includes/brand_colors.html" %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-primary min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <img src="{% static 'img/logo-blanco.png' %}" alt="Ingenio" class="mb-2" style="max-height: 48px;">
                        <h1 class="h4 mb-1">Ingenio</h1>
                        <p class="small mb-0 opacity-75">Ventas · SII · Aula</p>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" novalidate>
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label" for="id_username">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Tu usuario" required autofocus>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="id_password">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Tu contraseña" required>
                                </div>
                            </div>
                            {% if form.errors %}
                            <div class="alert alert-danger py-2" role="alert">
                                Usuario o contraseña incorrectos
                            </div>
                            {% endif %}
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                            </button>
                        </form>
                        <p class="mb-0 mt-3 text-center"><a class="link-secondary" href="{% url 'password_reset' %}">Olvidé mi contraseña</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
